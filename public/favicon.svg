<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Brand pink-to-purple 3D gradient matching original logo -->
    <linearGradient id="poBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e93" />
      <stop offset="45%" stop-color="#e6007e" />
      <stop offset="85%" stop-color="#aa0088" />
      <stop offset="100%" stop-color="#6b007b" />
    </linearGradient>

    <!-- Subtle inner highlight for 3D metallic ribbon effect -->
    <linearGradient id="poHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
    </linearGradient>

    <!-- Soft drop shadow for tab contrast -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4a0040" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Clean dark/light adaptable badge background -->
  <rect width="128" height="128" rx="28" fill="#ffffff" />

  <g filter="url(#shadow)">
    <!-- Signature Calligraphic 'P' Ribbon matching the Poonam script -->
    <path d="M 38 102 C 34 102 32 98 34 92 C 37 82 46 44 48 34 C 49 29 48 27 43 27 C 39 27 34 29 28 32 C 27 30 28 26 31 24 C 39 19 50 16 57 16 C 70 16 83 20 92 27 C 100 34 104 43 104 53 C 104 68 94 81 78 87 C 69 90 60 91 52 91 L 44 98 C 42 101 40 102 38 102 Z M 55 79 C 62 79 70 78 77 74 C 88 69 93 59 93 49 C 93 41 89 34 83 30 C 77 26 70 24 61 24 C 58 24 55 25 53 26 C 50 27 49 30 47 37 L 40 76 C 44 78 49 79 55 79 Z" fill="url(#poBrandGrad)" />
    <!-- 3D Top Sheen Overlay -->
    <path d="M 38 102 C 34 102 32 98 34 92 C 37 82 46 44 48 34 C 49 29 48 27 43 27 C 39 27 34 29 28 32 C 27 30 28 26 31 24 C 39 19 50 16 57 16 C 70 16 83 20 92 27 C 100 34 104 43 104 53 C 104 68 94 81 78 87 C 69 90 60 91 52 91 L 44 98 C 42 101 40 102 38 102 Z M 55 79 C 62 79 70 78 77 74 C 88 69 93 59 93 49 C 93 41 89 34 83 30 C 77 26 70 24 61 24 C 58 24 55 25 53 26 C 50 27 49 30 47 37 L 40 76 C 44 78 49 79 55 79 Z" fill="url(#poHighlight)" mix-blend-mode="overlay" />
  </g>
</svg>
